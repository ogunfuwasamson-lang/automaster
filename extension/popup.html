<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body { font: 13px/1.4 system-ui, sans-serif; width: 340px; margin: 0; padding: 14px; color: #171717; }
      h1 { font-size: 14px; margin: 0 0 8px; }
      input[type="text"], input[type="password"] { width: 100%; box-sizing: border-box; padding: 6px 8px; border: 1px solid #d4d4d4; border-radius: 6px; font: inherit; }
      button { padding: 5px 10px; border-radius: 6px; border: 1px solid #d4d4d4; background: #fff; font: inherit; cursor: pointer; }
      button.primary { background: #171717; color: #fff; border-color: #171717; }
      h1 { display: flex; align-items: center; gap: 8px; }
      h1 img { width: 18px; height: 18px; }
      .row { display: flex; gap: 6px; align-items: center; margin: 6px 0; }
      .muted { color: #737373; font-size: 12px; }
      .task { border: 1px solid #e5e5e5; border-radius: 6px; padding: 8px; margin: 6px 0; }
      .warn { color: #b45309; }
      .err { color: #b91c1c; }
      details { margin-top: 10px; }
    </style>
  </head>
  <body>
    <h1><img src="icons/icon-32.png" alt="" />Ivyward runner</h1>
    <style>.task.now{border-color:#9b2c4e;background:#fbf1f4}</style>
    <div id="setup">
      <p class="muted">Connect this browser to your Ivyward account. When a school's portal won't let Ivyward's cloud browser in, the agents finish that application here, in a tab you can watch.</p>
      <div class="row"><button class="primary" id="connect">Connect to Ivyward</button></div>
      <details>
        <summary class="muted">Or paste a key</summary>
        <input id="token" type="password" placeholder="amr_…" />
        <div class="row"><button id="save">Connect</button><span id="saveMsg" class="muted"></span></div>
      </details>
    </div>
    <div id="main" hidden>
      <div class="row">
        <label class="row" style="margin:0"><input type="checkbox" id="auto" /> Pick up applications Ivyward sends here</label>
      </div>
      <div id="active" class="task" hidden></div>
      <div id="paused" class="warn" hidden>Agents are paused in Ivyward.</div>
      <div id="tasks"><p class="muted">Loading…</p></div>
      <div class="row"><button class="primary" id="panel">Open side panel</button><button id="refresh">Check now</button></div>
      <div id="update" class="warn" hidden></div>
      <details>
        <summary class="muted">Settings</summary>
        <div class="row"><input id="api" type="text" /></div>
        <div class="row"><button id="saveApi">Save server</button><button id="logout">Disconnect</button></div>
      </details>
    </div>
    <p id="err" class="err"></p>
    <script src="popup.js"></script>
  </body>
</html>
