# official institution registries (US: IPEDS; UK: OfS Register, Scottish fundable bodies + SFC colleges, Medr, DfE NI), fetched by the build machine (the dev sandbox can't reach them), normalised by
# scripts/hed, saved to the `registry-data` branch with source URLs and checksums, and loaded into Supabase's
# hed_* tables when the SUPABASE_DB_URL secret is set (Supabase > Connect > Session pooler connection string).
# idempotent: re-running updates the same rows. runs when this workflow or the importers change, or by hand.
name: Fetch institution registries
on:
  push:
    branches: [main]
    paths: [.github/workflows/fetch-registries.yml, scripts/hed/**]
  workflow_dispatch:
permissions: { contents: write }
concurrency: { group: registries, cancel-in-progress: false }
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Download
        run: |
          set -euo pipefail
          mkdir -p out/raw out/processed && cd out/raw
          get() { # NAME URL
            curl -fsSL --retry 3 -A "ivyward-registry-fetch (+https://tryivyward.com)" -o "$1" "$2" && echo "$1	$2	$(date -u +%FT%TZ)	$(sha256sum "$1" | cut -c1-64)" >> ../SOURCES.tsv
          }
          # US: IPEDS institutional characteristics (directory)
          get ipeds-hd2024.zip https://nces.ed.gov/ipeds/datacenter/data/HD2024.zip
          # UK (England): the OfS Register of higher education providers, as published (spreadsheet)
          get ofs-register.download https://register-api.officeforstudents.org.uk/api/Download/ || echo "OfS register download failed"
          # UK (all nations): HESA's current providers (UKPRN, nation, category), Medr's register (Wales), and the UK
          # learning providers list (UKRLP: websites, addresses, postcode locations)
          get hesa-providers-current.csv "https://www.hesa.ac.uk/support/providers/all-hesa-providers?ProviderAllCurrentHESA.csv" || echo "HESA download failed"
          get hesa-providers-all.csv "https://www.hesa.ac.uk/support/providers/all-hesa-providers?ProviderAllHESAEnhanced.csv" || echo "HESA download failed"
          get medr-register.xlsx https://www.medr.cymru/wp-content/uploads/2026/07/Register-Medr-31Jul2026-English.xlsx || echo "Medr download failed"
          get learning-providers-plus.csv https://learning-provider.data.ac.uk/data/learning-providers-plus.csv || echo "learning providers download failed"
          # Canada: IRCC's designated learning institutions list (the institutions that may enrol study-permit holders)
          get ca-dli-list.html https://www.canada.ca/en/immigration-refugees-citizenship/services/study-canada/study-permit/prepare/designated-learning-institutions-list.html || echo "DLI page download failed"
          for u in $(grep -oE '(https://www\.canada\.ca)?/[^"'"'"' ]+\.(json|csv)' ca-dli-list.html 2>/dev/null | sort -u | head -5); do
            case "$u" in http*) ;; *) u="https://www.canada.ca$u" ;; esac
            get "ca-dli-$(basename "$u")" "$u" || echo "DLI data download failed: $u"
          done
          if [ -f ofs-register.download ]; then
            kind=$(file -b ofs-register.download); echo "OfS register: $kind"
            case "$kind" in *Excel*|*Microsoft*OOXML*|*Zip*) mv ofs-register.download ofs-register.xlsx ;; *CSV*|*text*) mv ofs-register.download ofs-register.csv ;; esac
            sed -i "s/ofs-register.download/$(ls ofs-register.* | head -1)/" ../SOURCES.tsv
          fi
          for z in ipeds-*.zip; do unzip -o -q "$z" -d "${z%.zip}"; done
          rm -f *.zip
      - name: Normalise
        run: |
          set -euo pipefail
          python3 -I scripts/hed/ipeds.py out/raw/ipeds-hd2024/HD2024.csv out/processed/us-ipeds-2024.json
          python3 -I scripts/hed/to_sql.py out/processed/us-ipeds-2024.json scripts/hed/us-source.json out/us.sql
          sudo python3 -m pip install -q --break-system-packages openpyxl==3.1.5
          python3 -I scripts/hed/ofs.py out/raw/ofs-register.xlsx out/processed/gb-ofs.json
          python3 -I scripts/hed/to_sql.py out/processed/gb-ofs.json scripts/hed/gb-ofs-source.json out/gb.sql
          python3 -I scripts/hed/uk_devolved.py scripts/hed/gb-devolved-seed.json out/raw/medr-register.xlsx out/raw/learning-providers-plus.csv out/processed/gb-devolved.json
          python3 -I scripts/hed/to_sql.py out/processed/gb-devolved.json scripts/hed/gb-devolved-source.json out/gb-devolved.sql
      - name: Load into Supabase
        env: { DB: "${{ secrets.SUPABASE_DB_URL }}" }
        run: |
          if [ -z "$DB" ]; then echo "SUPABASE_DB_URL not set: files saved, nothing loaded"; exit 0; fi
          for f in out/us.sql out/gb.sql out/gb-devolved.sql; do psql "$DB" -q -v ON_ERROR_STOP=1 -f "$f"; done
          psql "$DB" -Atc "select country, denominator, counts from public.hed_manifest order by country"
      - name: Save to the registry-data branch
        run: |
          set -euo pipefail
          rm -f out/*.sql
          cd out
          git init -q -b registry-data
          git config user.name "registry-fetch"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Registry files fetched $(date -u +%F)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" registry-data
