# deploy to Agent37 on every push to main, once the repository has these secrets
# (Settings > Secrets and variables > Actions):
#   AGENT37_API_KEY      Agent37 workspace API key
#   AGENT37_ENV          the whole env.production file (KEY=value lines)
#   AGENT37_INSTANCE_ID  set after the first deploy prints it (leave unset for the first run)
# optional single-value secrets that replace the same line in AGENT37_ENV, so changing one key doesn't mean
# pasting the whole file again (a secret's contents can't be read back from GitHub):
#   COMPOSIO_API_KEY
#   GOOGLE_PICKER_KEY    the browser key for "Import from Google Drive" on the documents page (restricted to the site)
#   WHATSAPP_TOKEN       the Flolyt system user's token for the FLOLYT TECH app (WhatsApp Cloud API)
#   WHATSAPP_APP_SECRET  FLOLYT TECH's app secret (checks Meta's signature on incoming WhatsApp messages)
#   WHATSAPP_VERIFY_TOKEN  the phrase typed in the app's webhook settings, so Meta can confirm the webhook
name: Deploy to Agent37
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency: { group: agent37-deploy, cancel-in-progress: false }
permissions: { contents: read }
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Check secrets
        id: ready
        env: { KEY: "${{ secrets.AGENT37_API_KEY }}" }
        run: if [ -n "$KEY" ]; then echo "ok=1" >> "$GITHUB_OUTPUT"; else echo "AGENT37_API_KEY not set; skipping"; fi
      - uses: actions/checkout@v4
        if: steps.ready.outputs.ok == '1'
      - uses: actions/setup-node@v4
        if: steps.ready.outputs.ok == '1'
        with: { node-version: 22 }
      - name: Deploy
        if: steps.ready.outputs.ok == '1'
        env:
          AGENT37_API_KEY: ${{ secrets.AGENT37_API_KEY }}
          AGENT37_INSTANCE_ID: ${{ secrets.AGENT37_INSTANCE_ID }}
          ENV_FILE: ${{ secrets.AGENT37_ENV }}
          OVERRIDE_COMPOSIO_API_KEY: ${{ secrets.COMPOSIO_API_KEY }}
          OVERRIDE_GOOGLE_PICKER_KEY: ${{ secrets.GOOGLE_PICKER_KEY }}
          OVERRIDE_WHATSAPP_TOKEN: ${{ secrets.WHATSAPP_TOKEN }}
          OVERRIDE_WHATSAPP_APP_SECRET: ${{ secrets.WHATSAPP_APP_SECRET }}
          OVERRIDE_WHATSAPP_VERIFY_TOKEN: ${{ secrets.WHATSAPP_VERIFY_TOKEN }}
        run: |
          umask 077
          printf '%s\n' "$ENV_FILE" > deploy/agent37/env.production
          # a separately saved key wins over the one inside AGENT37_ENV
          for name in COMPOSIO_API_KEY GOOGLE_PICKER_KEY WHATSAPP_TOKEN WHATSAPP_APP_SECRET WHATSAPP_VERIFY_TOKEN; do
            val=$(printenv "OVERRIDE_$name" || true)
            [ -z "$val" ] && continue
            grep -v "^$name=" deploy/agent37/env.production > deploy/agent37/env.tmp || true
            printf '%s=%s\n' "$name" "$val" >> deploy/agent37/env.tmp
            mv deploy/agent37/env.tmp deploy/agent37/env.production
            echo "using the separately saved $name"
          done
          bash deploy/agent37/deploy.sh
          rm -f deploy/agent37/env.production
