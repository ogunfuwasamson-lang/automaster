# every push and pull request: types, lint, the full test suite (database invariants against a real postgres,
# billing races, security regressions) and a dependency audit of what ships.
name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions: { contents: read }
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: am, POSTGRES_PASSWORD: am, POSTGRES_DB: am_test }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U am" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://am:am@localhost:5432/am_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --no-audit --no-fund
      # two tests drive a real browser. the system packages come from ubuntu's mirrors, which some runners can't
      # reach; the runner image already has what headless chromium needs, so fall back to the browser alone
      - run: npm i --no-save playwright@1.63.0 && (timeout 300 npx playwright install --with-deps chromium || npx playwright install chromium)
      - run: npx tsc --noEmit -p .
      - run: npx eslint src --quiet
      - run: npx vitest run
      - name: Audit shipped dependencies (high and critical)
        run: npm audit --omit=dev --audit-level=critical
