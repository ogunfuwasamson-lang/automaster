<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Ivyward ad 4: next year, I'll apply</title>
<style>
  @font-face { font-family: "Frank"; src: url(fonts/frank-ruhl-libre-latin-400-normal.woff2) format("woff2"); font-weight: 400; }
  @font-face { font-family: "Frank"; src: url(fonts/frank-ruhl-libre-latin-500-normal.woff2) format("woff2"); font-weight: 500; }
  @font-face { font-family: "Flex"; src: url(fonts/roboto-flex-latin-wght-normal.woff2) format("woff2"); font-weight: 100 1000; }
  /* Facebook ad C (Dec 2026), 4:5. The first two beats play over AI-generated B-roll laid in afterwards:
     during those beats this page draws only the caption on a transparent page (window.CAPTION_ONLY). */
  :root { --bg: #fafafa; --ink: #09090b; --body: #27272a; --muted: #52525b; --line: #e4e4e7; --ox: #9b2c4e; --rose: #f6e7ec; --go: #047857; --gobg: #e6f4ee; --dark: #18181b; --night: #141418; --u: 1vw; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100vw; height: 100vh; overflow: hidden; background: var(--bg); color: var(--ink); font-family: "Flex", system-ui, sans-serif; }
  html.caponly, body.caponly { background: transparent; }
  .scene { position: absolute; inset: 0; display: none; }
  .serif { font-family: "Frank", Georgia, serif; font-weight: 400; letter-spacing: -0.02em; }
  .w { display: inline-block; opacity: 0; }
  .ox { color: var(--ox); }
  .ink { position: absolute; left: -22vw; width: 144vw; bottom: -1vh; opacity: .9; transform-origin: 50% 100%; }
  .brandrow { position: absolute; left: 7vw; top: 5vh; display: flex; align-items: center; gap: calc(var(--u)*1.3); z-index: 3; }
  .brandrow img { width: calc(var(--u)*5); height: calc(var(--u)*5); }
  .brandrow span { font-family: "Frank", Georgia, serif; font-size: calc(var(--u)*4.6); }
  #cap { position: absolute; left: 50%; top: 76vh; transform: translate(-50%, -50%); background: rgba(24,24,27,.9); color: #fff; font-weight: 650; font-size: calc(var(--u)*5); line-height: 1.18; white-space: nowrap; padding: calc(var(--u)*2.6) calc(var(--u)*4.4); border-radius: calc(var(--u)*3); text-align: center; width: max-content; max-width: 88vw; display: none; }
  /* the night list */
  #list { background: var(--night); color: #f4f4f5; }
  .clock { position: absolute; left: 7vw; top: 5vh; font-weight: 650; font-size: calc(var(--u)*5); color: #fca5a5; font-variant-numeric: tabular-nums; }
  .count { position: absolute; right: 7vw; top: 5.4vh; font-weight: 600; font-size: calc(var(--u)*4); color: #a1a1aa; }
  .tasks { position: absolute; left: 7vw; right: 7vw; top: 14vh; display: grid; grid-template-columns: 1fr 1fr; gap: calc(var(--u)*1.4) calc(var(--u)*2); }
  .task { display: flex; align-items: center; gap: calc(var(--u)*1.8); background: #1f1f25; border: 1px solid #2e2e36; border-radius: calc(var(--u)*2); padding: calc(var(--u)*1.5) calc(var(--u)*1.8); font-size: calc(var(--u)*2.8); opacity: 0; white-space: nowrap; overflow: hidden; }
  .box { width: calc(var(--u)*3.6); height: calc(var(--u)*3.6); border-radius: calc(var(--u)*.9); border: 2px solid #52525b; flex: none; position: relative; }
  .task.done { color: #71717a; text-decoration: line-through; }
  .task.done .box { background: var(--go); border-color: var(--go); }
  .task.done .box::after { content: ""; position: absolute; inset: 15%; background: url(check.svg) center/contain no-repeat; filter: brightness(10); }
  .task.last { grid-column: 1 / -1; justify-content: center; background: #fff; color: var(--ink); font-weight: 700; font-size: calc(var(--u)*4.6); padding: calc(var(--u)*3); border: 0; text-decoration: none; }
  .task.last .box { border-color: var(--ox); }
  #say { text-wrap: balance; position: absolute; left: 7vw; right: 7vw; bottom: 9vh; font-size: calc(var(--u)*8.6); line-height: 1.06; color: #fff; text-shadow: 0 calc(var(--u)*.4) calc(var(--u)*3) rgba(0,0,0,.6); }
  #dim { position: absolute; inset: 0; background: rgba(20,20,24,.82); opacity: 0; }
  /* end card */
  #cta .c { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; padding: 22vh 8vw 0; text-align: center; }
  .tile { width: calc(var(--u)*17); height: calc(var(--u)*17); border-radius: calc(var(--u)*4.2); background: var(--ox); display: flex; align-items: center; justify-content: center; }
  .tile img { width: 72%; height: 72%; }
  .btn { margin-top: calc(var(--u)*6); padding: calc(var(--u)*3.2) calc(var(--u)*7.5); background: var(--ox); color: #fff; border-radius: 999px; font-weight: 650; font-size: calc(var(--u)*5.6); }
  .urlpill { position: absolute; left: 50%; transform: translateX(-50%); bottom: 6vh; background: var(--dark); color: #fff; font-weight: 600; font-size: calc(var(--u)*3.6); padding: calc(var(--u)*1.7) calc(var(--u)*3.4); border-radius: calc(var(--u)*1.9); }
</style>
</head>
<body>
<div id="cap"></div>

<section class="scene" id="list">
  <div class="clock" id="clock">11:40 PM</div>
  <div class="count" id="count"></div>
  <div class="tasks" id="tasks"></div>
  <div id="dim"></div>
  <div class="serif" id="say"></div>
</section>

<section class="scene" id="cta">
  <img class="ink" src="ink.png" alt="">
  <div class="brandrow"><img src="mark.svg" alt=""><span>Ivyward</span></div>
  <div class="c">
    <div class="tile" id="cm"><img src="mark-light.svg" alt=""></div>
    <div class="serif" id="cn" style="text-wrap:balance;font-size:calc(var(--u)*10.4);line-height:1.04;margin-top:calc(var(--u)*5)">Apply this year, not “next year”.</div>
    <div class="btn" id="cb">Start free</div>
  </div>
  <div class="urlpill" id="cu">tryivyward.com</div>
</section>

<script>
const B = Object.fromEntries((window.BEATS || []).map((b) => [b.id, b]));
const $ = (s) => document.querySelector(s);
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const ease = (x) => 1 - Math.pow(1 - clamp(x), 3);
const back = (x) => { x = clamp(x); const c = 1.2; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const VW = innerWidth / 100;
const BROLL = ["schools", "essays"];
const CAPS = { schools: "6 schools. 6 application forms.", essays: "6 sets of essays. 6 deadlines." };

function words(el, html) {
  el.innerHTML = html;
  const walk = document.createTreeWalker(el, NodeFilter.SHOW_TEXT), nodes = [];
  while (walk.nextNode()) nodes.push(walk.currentNode);
  for (const n of nodes) {
    const f = document.createDocumentFragment();
    for (const p of n.textContent.split(/(\s+)/)) {
      if (!p) continue;
      if (/^\s+$/.test(p)) { f.appendChild(document.createTextNode(" ")); continue; }
      const w = document.createElement("span"); w.className = "w"; w.textContent = p; f.appendChild(w);
    }
    n.replaceWith(f);
  }
  return [...el.querySelectorAll(".w")];
}
// six schools, four jobs each: 24 tasks
const JOBS = ["Application form", "Essays", "Pay the fee", "Transcripts"];
const TASKS = [];
for (let i = 1; i <= 6; i++) for (const j of JOBS) TASKS.push(`School ${i}: ${j}`);
const taskEls = TASKS.slice(0, 16).map((txt) => { const d = document.createElement("div"); d.className = "task"; d.innerHTML = `<span class="box"></span>${txt}`; $("#tasks").appendChild(d); return d; });
const last = document.createElement("div"); last.className = "task last"; last.innerHTML = `<span class="box"></span>Review and sign`; $("#tasks").appendChild(last);
const SAY = { job: `On top of a full-time job, that's <span class="ox" style="color:#f9a8c4">weeks of evenings.</span>`, again: `So it becomes “next year, I'll apply.” Again.`, done: `This year, every application filled in for you.`, sign: `Your part: <span style="color:#f9a8c4">read and sign.</span>` };
const sayw = {}; // built on demand

function renderAt(t) {
  const b = (window.BEATS || []).find((x) => t >= x.start && t < x.start + x.dur) || window.BEATS[window.BEATS.length - 1];
  const s = t - b.start, d = b.dur;
  const broll = BROLL.includes(b.id);
  document.body.classList.toggle("caponly", broll && !!window.CAPTION_ONLY); document.documentElement.classList.toggle("caponly", broll && !!window.CAPTION_ONLY);
  $("#list").style.display = ["job", "again", "done", "sign"].includes(b.id) ? "block" : "none";
  $("#cta").style.display = b.id === "cta" ? "block" : "none";
  document.querySelectorAll(".ink").forEach((el) => (el.style.transform = `translateX(${Math.sin(t * 0.25) * 1.3 * VW}px) scale(${1 + 0.05 * t / window.TOTAL})`));

  $("#cap").style.display = broll ? "block" : "none";
  if (broll) {
    $("#cap").textContent = CAPS[b.id];
    const k = window.CAPTION_ONLY ? 1 : back(s / 0.3);
    $("#cap").style.opacity = clamp(k);
    $("#cap").style.transform = `translate(-50%, -50%) scale(${0.9 + 0.1 * k})`;
    if (!window.CAPTION_ONLY) document.body.style.background = "#222";
  } else document.body.style.background = "";

  if ($("#list").style.display === "block") {
    const since = t - B.job.start;
    const mins = Math.min(59, 40 + Math.floor(since * 1.5));
    $("#clock").textContent = `11:${String(mins).padStart(2, "0")} PM`;
    // the list fills during "job", every task appears one by one
    const shown = b.id === "job" ? Math.floor(clamp(s / (d * 0.8)) * taskEls.length) : taskEls.length;
    taskEls.forEach((el, i) => { const k = b.id === "job" ? back((s - (i / taskEls.length) * d * 0.8) / 0.25) : 1; el.style.opacity = clamp(k); el.style.transform = `scale(${0.9 + 0.1 * k})`; });
    $("#count").textContent = `${b.id === "job" ? Math.round(shown / taskEls.length * 24) : 24} tasks`;
    // ticked off during "done", one left
    const ticked = b.id === "done" ? Math.floor(clamp((s - 0.2) / (d * 0.75)) * taskEls.length) : b.id === "sign" ? taskEls.length : 0;
    taskEls.forEach((el, i) => el.classList.toggle("done", i < ticked));
    if (ticked >= taskEls.length) $("#count").textContent = "1 task";
    const lk = b.id === "sign" ? back(s / 0.4) : 0;
    last.style.opacity = clamp(lk); last.style.transform = `scale(${0.85 + 0.15 * lk})`;
    $("#dim").style.opacity = b.id === "again" ? ease(s / 0.4) * 1 : 0;
    // the line on screen
    const key = b.id;
    if ($("#say").dataset.k !== key) { sayw[key] = words($("#say"), SAY[key]); $("#say").dataset.k = key; }
    const ws = sayw[key], span = b.voice * 0.85;
    ws.forEach((w, i) => { const k = ease((s - 0.05 - (i / ws.length) * span) / 0.25); w.style.opacity = k; w.style.transform = `translateY(${(1 - k) * 0.3}em)`; });
    $("#say").style.bottom = b.id === "again" ? "38vh" : "6vh";
    $("#say").style.fontSize = b.id === "again" ? `${VW * 11}px` : `${VW * 7.4}px`;
  }
  if (b.id === "cta") {
    const k = (x, w = 0.4) => back((s - x) / w);
    $("#cm").style.transform = `scale(${k(0)})`;
    [["#cn", 0.25], ["#cb", 0.7]].forEach(([q, at]) => { const v = k(at); $(q).style.opacity = clamp(v); $(q).style.transform = `translateY(${(1 - clamp(v)) * VW * 4}px) scale(${q === "#cb" ? 0.9 + 0.1 * v + (s > 1.4 ? 0.025 * Math.sin((s - 1.4) * 5) : 0) : 1})`; });
  }
}

function cues() {
  const sfx = [];
  sfx.push({ t: B.job.start - 0.08, kind: "whoosh", gain: 0.5 });
  for (let i = 0; i < 16; i += 3) sfx.push({ t: B.job.start + (i / 16) * B.job.dur * 0.8, kind: "tick", gain: 0.4 });
  sfx.push({ t: B.done.start, kind: "rise", gain: 0.8 });
  for (let i = 0; i < 16; i += 3) sfx.push({ t: B.done.start + 0.2 + (i / 16) * B.done.dur * 0.75, kind: "tick", gain: 0.45 });
  sfx.push({ t: B.sign.start, kind: "chime", gain: 0.8 });
  sfx.push({ t: B.cta.start - 0.1, kind: "whoosh", gain: 0.6 });
  return { sfx, music: { bpm: 100, key: "F", drumsFrom: B.done.start, endCard: B.cta.start } };
}
window.renderAt = renderAt; window.cues = cues;
</script>
</body>
</html>
