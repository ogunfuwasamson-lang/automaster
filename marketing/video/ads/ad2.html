<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Ivyward ad 2</title>
<style>
  @font-face { font-family: "Frank"; src: url(fonts/frank-ruhl-libre-latin-500-normal.woff2) format("woff2"); font-weight: 500; }
  @font-face { font-family: "Flex"; src: url(fonts/roboto-flex-latin-wght-normal.woff2) format("woff2"); font-weight: 100 1000; }
  :root { --bg: #f6f3ef; --ink: #0f0f12; --muted: #6b6b74; --line: #e4e1dc; --ox: #9b2c4e; --rose: #f7d6e1; --go: #047857; --gobg: #e3f4ec; --stop: #b91c1c; --stopbg: #fdecec; --u: 1vw; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100vw; height: 100vh; overflow: hidden; background: var(--bg); color: var(--ink); font-family: "Flex", system-ui, sans-serif; }
  .abs { position: absolute; }
  .scene { position: absolute; inset: 0; display: none; }
  .bold { font-weight: 850; letter-spacing: -0.025em; }
  .w { display: inline-block; opacity: 0; }
  #ask .q { position: absolute; left: 7vw; right: 7vw; top: 37vh; font-size: calc(var(--u)*10.4); line-height: 1.02; }
  .ox { color: var(--ox); }
  .note { position: absolute; padding: calc(var(--u)*2.4) calc(var(--u)*3); background: #ffe680; color: #3b3000; font-weight: 750; font-size: calc(var(--u)*4.2); box-shadow: 0 calc(var(--u)*1.2) calc(var(--u)*3) rgba(60,40,0,.18); border-radius: calc(var(--u)*.6); }
  .note.pink { background: #ffd1df; color: #4a0f22; }
  .note.blue { background: #cfe6ff; color: #0b2a4a; }
  /* split */
  #split { position: absolute; inset: 0; display: none; }
  .half { position: absolute; left: 0; right: 0; height: 50vh; overflow: hidden; }
  #top { top: 0; background: #ebe7e2; }
  #bot { top: 50vh; background: #fbfaf8; }
  .tag { position: absolute; left: 5vw; top: 3.2vh; display: inline-flex; align-items: center; gap: calc(var(--u)*1.6); padding: calc(var(--u)*1.4) calc(var(--u)*2.8); border-radius: 999px; font-weight: 800; font-size: calc(var(--u)*3.6); }
  #top .tag { background: #fff; color: var(--stop); border: 2px solid rgba(185,28,28,.25); }
  #bot .tag { background: var(--ink); color: #fff; top: 4.4vh; }
  #bot .tag img { width: calc(var(--u)*4.6); height: calc(var(--u)*4.6); }
  .win { position: absolute; left: 5vw; right: 5vw; top: 10vh; height: 36vh; background: #fff; border-radius: calc(var(--u)*2.6); box-shadow: 0 calc(var(--u)*1.5) calc(var(--u)*5) rgba(0,0,0,.12); overflow: hidden; }
  .tabs { display: flex; gap: calc(var(--u)*.6); padding: calc(var(--u)*1.6) calc(var(--u)*1.6) 0; background: #f0eeeb; height: calc(var(--u)*7); overflow: hidden; }
  .tabx { flex: 0 0 auto; width: calc(var(--u)*9); height: calc(var(--u)*5.4); background: #e2dfda; border-radius: calc(var(--u)*1.2) calc(var(--u)*1.2) 0 0; }
  .tabx.on { background: #fff; }
  .winbody { padding: calc(var(--u)*3.4); }
  .big { font-size: calc(var(--u)*5.4); font-weight: 800; letter-spacing: -0.02em; }
  .meta { font-size: calc(var(--u)*3.4); color: var(--muted); margin-top: calc(var(--u)*1); }
  .bar { height: calc(var(--u)*2); background: #ebe8e3; border-radius: 99px; margin-top: calc(var(--u)*2.2); }
  .modal { position: absolute; left: 50%; top: 55%; transform: translate(-50%, -50%); width: 78%; background: #fff; border: 3px solid var(--stop); border-radius: calc(var(--u)*2.4); padding: calc(var(--u)*3.4); box-shadow: 0 calc(var(--u)*2) calc(var(--u)*6) rgba(185,28,28,.25); text-align: center; }
  .modal .t { color: var(--stop); font-weight: 850; font-size: calc(var(--u)*5); }
  .modal .s { color: var(--muted); font-size: calc(var(--u)*3.3); margin-top: calc(var(--u)*1); }
  .clock { position: absolute; right: 5vw; top: 3.2vh; font-weight: 850; font-size: calc(var(--u)*4.4); color: var(--stop); font-variant-numeric: tabular-nums; }
  .list { position: absolute; left: 5vw; right: 5vw; top: 12vh; }
  .item { display: flex; align-items: center; justify-content: space-between; gap: calc(var(--u)*2); background: #fff; border: 1px solid var(--line); border-radius: calc(var(--u)*2.2); padding: calc(var(--u)*3.4) calc(var(--u)*3.4); margin-bottom: calc(var(--u)*2.2); box-shadow: 0 calc(var(--u)*.6) calc(var(--u)*2) rgba(0,0,0,.05); }
  .item .nm { font-weight: 750; font-size: calc(var(--u)*4.6); }
  .item .ct { color: var(--muted); font-size: calc(var(--u)*3.4); margin-top: calc(var(--u)*.5); }
  .pill { font-size: calc(var(--u)*2.8); font-weight: 800; padding: calc(var(--u)*1) calc(var(--u)*2); border-radius: 999px; white-space: nowrap; }
  .pill.go { color: var(--go); background: var(--gobg); }
  .pill.ox { color: var(--ox); background: var(--rose); }
  .tick { width: calc(var(--u)*6); height: calc(var(--u)*6); border-radius: 50%; background: var(--go); color: #fff; display: inline-flex; align-items: center; justify-content: center; font-weight: 900; font-size: calc(var(--u)*3.6); flex: none; }
  .spin { width: calc(var(--u)*6); height: calc(var(--u)*6); border-radius: 50%; border: calc(var(--u)*.9) solid #ddd; border-top-color: var(--muted); flex: none; }
  #cap { position: absolute; left: 50%; top: 50vh; transform: translate(-50%, -50%); z-index: 5; background: var(--ink); color: #fff; font-weight: 800; font-size: calc(var(--u)*4.6); padding: calc(var(--u)*2) calc(var(--u)*3.6); border-radius: 999px; white-space: nowrap; text-align: center; max-width: 92vw; }
  #cap .y { color: #ffd1df; }
  #cta { background: var(--ink); color: #fff; }
  #cta .c { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 0 8vw; }
  .serif { font-family: "Frank", Georgia, serif; font-weight: 500; }
  .btn { margin-top: calc(var(--u)*7); padding: calc(var(--u)*3.6) calc(var(--u)*8); background: #f0a3bd; color: #2a0a16; border-radius: 999px; font-weight: 850; font-size: calc(var(--u)*6.4); }
</style>
</head>
<body>

<section class="scene" id="ask">
  <div id="notes"></div>
  <div class="q bold" id="askt"></div>
</section>

<section id="split">
  <div class="half" id="top">
    <div class="tag" id="ttag">Doing it alone</div>
    <div class="clock" id="clock">11:52 PM</div>
    <div class="win" id="twin">
      <div class="tabs" id="tabs"></div>
      <div class="winbody">
        <div class="big" id="tbig">Application form</div>
        <div class="meta" id="tmeta">Page 3 of 12</div>
        <div class="bar" style="width:92%"></div><div class="bar" style="width:76%"></div><div class="bar" style="width:84%"></div>
      </div>
      <div class="modal" id="tmodal"><div class="t" id="tmt">Session expired</div><div class="s" id="tms">Unsaved changes lost</div></div>
    </div>
  </div>
  <div class="half" id="bot">
    <div class="tag" id="btag"><img src="mark-light.svg" alt="">With Ivyward AI</div>
    <div class="list" id="blist"></div>
  </div>
  <div id="cap"></div>
</section>

<section class="scene" id="cta">
  <div class="c">
    <img id="cm" src="mark-light.svg" alt="" style="width:calc(var(--u)*22);height:calc(var(--u)*22)">
    <div class="serif" id="cn" style="font-size:calc(var(--u)*17);margin-top:calc(var(--u)*3)">Ivyward</div>
    <div id="cs" style="font-size:calc(var(--u)*5.2);color:#d4d4d8;margin-top:calc(var(--u)*2.6);line-height:1.25">Your university applications,<br>done for you.</div>
    <div class="btn" id="cb">Start for free</div>
    <div id="cu" style="font-size:calc(var(--u)*5.4);margin-top:calc(var(--u)*3.4);font-weight:700">tryivyward.com</div>
  </div>
</section>

<script>
const B = Object.fromEntries((window.BEATS || []).map((b) => [b.id, b]));
const $ = (s) => document.querySelector(s);
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const ease = (x) => 1 - Math.pow(1 - clamp(x), 3);
const back = (x) => { x = clamp(x); const c = 1.9; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const VW = innerWidth / 100;

function words(el, html) {
  el.innerHTML = html;
  const walk = document.createTreeWalker(el, NodeFilter.SHOW_TEXT), nodes = [];
  while (walk.nextNode()) nodes.push(walk.currentNode);
  for (const n of nodes) {
    const f = document.createDocumentFragment();
    for (const p of n.textContent.split(/(\s+)/)) {
      if (!p) continue;
      if (/^\s+$/.test(p)) { f.appendChild(document.createTextNode(" ")); continue; }
      const w = document.createElement("span"); w.className = "w"; w.textContent = p; f.appendChild(w);
    }
    n.replaceWith(f);
  }
  return [...el.querySelectorAll(".w")];
}
const askw = words($("#askt"), `Planning your <span class="ox">master's abroad</span>, but don't know where to start?`);
const NOTES = [["Which school?", "", 6, 9, -6], ["Funding??", "pink", 58, 7, 5], ["SOP", "blue", 64, 22, -4], ["Deadline?!", "pink", 8, 24, 4], ["IELTS?", "", 60, 72, 6], ["12 forms", "blue", 8, 74, -5], ["Visa?", "", 40, 86, 3]];
const notes = NOTES.map(([t, c, x, y, a]) => { const d = document.createElement("div"); d.className = "note " + c; d.textContent = t; d.style.left = x + "vw"; d.style.top = y + "vh"; d.dataset.a = a; $("#notes").appendChild(d); return d; });
for (let i = 0; i < 9; i++) { const t = document.createElement("div"); t.className = "tabx" + (i === 8 ? " on" : ""); $("#tabs").appendChild(t); }

const ITEMS = {
  find: [["MSc Data Science", "United Kingdom", `<span class="pill go">Scholarship match</span>`], ["MA Public Policy", "Canada", `<span class="pill ox">Fully funded option</span>`], ["MSc Public Health", "Netherlands", `<span class="pill go">Scholarship match</span>`]],
};
function listHTML(stage) {
  if (stage === "with") return ["Programmes and scholarships", "Essays", "Application forms"].map((t) => `<div class="item"><div class="nm">${t}</div><span class="spin"></span></div>`).join("");
  if (stage === "find") return ITEMS.find.map(([n, c, p]) => `<div class="item"><div><div class="nm">${n}</div><div class="ct">${c}</div></div>${p}</div>`).join("");
  if (stage === "essay") return [["Statement of purpose", "MSc Data Science"], ["Scholarship essay", "MA Public Policy"], ["Personal statement", "MSc Public Health"]].map(([n, c]) => `<div class="item"><div><div class="nm">${n}</div><div class="ct">${c} · written and checked</div></div><span class="tick">✓</span></div>`).join("");
  if (stage === "form") return [["United Kingdom", "12 of 12 pages"], ["Canada", "9 of 9 pages"], ["Netherlands", "7 of 7 pages"]].map(([n, c]) => `<div class="item"><div><div class="nm">${n}</div><div class="ct">Application form · ${c} filled</div></div><span class="tick">✓</span></div>`).join("") + `<div class="item" style="background:var(--ink);color:#fff;justify-content:center"><div class="nm">Ready for your signature</div></div>`;
  return "";
}
let lastStage = "";
function setList(stage) { if (stage !== lastStage) { $("#blist").innerHTML = listHTML(stage); lastStage = stage; } return [...$("#blist").children]; }

const CAPS = {
  alone: `Here's how it usually goes…`,
  with: `…and with <span class="y">Ivyward AI</span>`,
  find: `Finds <span class="y">funded programmes</span> that fit you`,
  essay: `Writes <span class="y">your essays</span>`,
  form: `Fills <span class="y">every application</span>`,
};

function renderAt(t) {
  const b = (window.BEATS || []).find((x) => t >= x.start && t < x.start + x.dur) || window.BEATS[window.BEATS.length - 1];
  const s = t - b.start, d = b.dur;
  $("#ask").style.display = b.id === "ask" ? "block" : "none";
  $("#split").style.display = ["alone", "with", "find", "essay", "form"].includes(b.id) ? "block" : "none";
  $("#cta").style.display = b.id === "cta" ? "block" : "none";

  if (b.id === "ask") {
    const span = b.voice * 0.9;
    askw.forEach((w, i) => { const k = back((s - 0.1 - (i / askw.length) * span) / 0.25); w.style.opacity = clamp(k * 1.4); w.style.transform = `translateY(${(1 - clamp(k)) * 0.4}em) scale(${0.8 + 0.2 * k})`; });
    notes.forEach((n, i) => { const k = back((s - 0.3 - i * 0.32) / 0.3); n.style.opacity = clamp(k); n.style.transform = `rotate(${n.dataset.a}deg) scale(${k})`; });
    // the whole screen slides up as the split arrives
    $("#ask").style.transform = `translateY(${-ease((s - (d - 0.25)) / 0.25) * 100}vh)`;
  }
  if ($("#split").style.display === "block") {
    const sinceAlone = t - B.alone.start;
    // top slides down from above; bottom fades up when "with" starts
    $("#top").style.transform = `translateY(${(1 - ease(sinceAlone / 0.35)) * -50}vh)`;
    const sinceWith = t - B.with.start;
    const bk = ease(sinceWith / 0.4);
    $("#bot").style.opacity = b.id === "alone" ? 0.25 : 0.25 + 0.75 * bk;
    $("#bot").style.filter = b.id === "alone" ? "grayscale(1)" : `grayscale(${1 - bk})`;
    $("#btag").style.transform = `scale(${b.id === "alone" ? 0.95 : 0.95 + 0.05 * back(sinceWith / 0.4)})`;
    // top: the clock runs, tabs pile up, the session expires, then an upload fails
    const mins = Math.min(59, 52 + Math.floor(sinceAlone / 2.2));
    $("#clock").textContent = `11:${String(mins).padStart(2, "0")} PM`;
    const nt = Math.min(9, 3 + Math.floor(sinceAlone * 1.6));
    [...$("#tabs").children].forEach((x, i) => (x.style.display = i < nt ? "block" : "none"));
    let modal = 0, mt = "Session expired", ms = "Unsaved changes lost", big = "Application form", meta = "Page 3 of 12";
    if (b.id === "alone") modal = back((s - 1.1) / 0.3);
    if (b.id === "with") { modal = 1 - ease((s - 0.2) / 0.3); }
    if (b.id === "find") { big = "Scholarship search"; meta = "Searching… 0 results that fit"; }
    if (b.id === "essay") { big = "SOP_v5_FINAL_final.docx"; meta = "Rewriting it again"; }
    if (b.id === "form") { mt = "Upload failed"; ms = "transcript.pdf: try again"; big = "Application form"; meta = "Page 9 of 12"; modal = back((s - 0.5) / 0.3); }
    $("#tbig").textContent = big; $("#tmeta").textContent = meta; $("#tmt").textContent = mt; $("#tms").textContent = ms;
    $("#tmodal").style.opacity = clamp(modal); $("#tmodal").style.transform = `translate(-50%, -50%) scale(${0.7 + 0.3 * modal})`;
    const shake = (b.id === "alone" && s > 1.1 && s < 1.5) || (b.id === "form" && s > 0.5 && s < 0.9) ? Math.sin(t * 70) * VW * 0.8 : 0;
    $("#twin").style.transform = `translateX(${shake}px)`;
    // bottom: the agent's work, item by item
    const stage = b.id === "alone" ? "with" : b.id;
    const items = setList(stage);
    items.forEach((it, i) => { const k = back((s - (b.id === "alone" ? 99 : 0.25 + i * 0.28)) / 0.3); it.style.opacity = b.id === "alone" ? 0.6 : clamp(k); it.style.transform = `translateY(${(1 - clamp(k)) * VW * 5}px) scale(${b.id === "alone" ? 1 : 0.92 + 0.08 * k})`; });
    // caption on the seam
    $("#cap").innerHTML = CAPS[b.id] || "";
    const ck = back(s / 0.3);
    $("#cap").style.opacity = Math.min(clamp(ck), ease((d - s) / 0.12));
    $("#cap").style.transform = `translate(-50%, -50%) scale(${0.85 + 0.15 * ck})`;
    // the halves pull apart to make way for the end card
    if (b.id === "form") { const out = ease((s - (d - 0.3)) / 0.3); $("#top").style.transform = `translateY(${-out * 50}vh)`; $("#bot").style.transform = `translateY(${out * 50}vh)`; }
    else $("#bot").style.transform = "none";
  }
  if (b.id === "cta") {
    const k = (x, w = 0.4) => back((s - x) / w);
    $("#cm").style.transform = `scale(${k(0)})`;
    [["#cn", 0.2], ["#cs", 0.4], ["#cb", 0.7], ["#cu", 0.9]].forEach(([q, at]) => { const v = k(at); $(q).style.opacity = clamp(v); $(q).style.transform = `translateY(${(1 - clamp(v)) * VW * 4}px) scale(${q === "#cb" ? 0.9 + 0.1 * v + (s > 1.5 ? 0.025 * Math.sin((s - 1.5) * 5) : 0) : 1})`; });
  }
}

function cues() {
  const sfx = [];
  NOTES.forEach((n, i) => sfx.push({ t: B.ask.start + 0.3 + i * 0.32, kind: "pop", gain: 0.55 }));
  sfx.push({ t: B.alone.start - 0.15, kind: "whoosh", gain: 0.9 });
  sfx.push({ t: B.alone.start + 0.3, kind: "type", gain: 0.6 });
  sfx.push({ t: B.alone.start + 1.1, kind: "buzz", gain: 0.9 });
  sfx.push({ t: B.with.start, kind: "whoosh", gain: 0.7 });
  sfx.push({ t: B.with.start + 0.1, kind: "ping", gain: 0.7 });
  for (const id of ["find", "essay", "form"]) [0, 1, 2].forEach((i) => sfx.push({ t: B[id].start + 0.25 + i * 0.28, kind: id === "find" ? "tick" : "success", gain: id === "find" ? 0.9 : 0.55 }));
  sfx.push({ t: B.form.start + 0.5, kind: "buzz", gain: 0.6 });
  sfx.push({ t: B.form.start + 0.25 + 3 * 0.28, kind: "success", gain: 0.9 });
  sfx.push({ t: B.cta.start - 0.2, kind: "whoosh", gain: 0.9 });
  sfx.push({ t: B.cta.start + 0.05, kind: "hit", gain: 0.8 });
  return { sfx, music: { style: "afro", breaks: [[B.alone.start, B.with.start]] } };
}
window.renderAt = renderAt; window.cues = cues;
</script>
</body>
</html>
