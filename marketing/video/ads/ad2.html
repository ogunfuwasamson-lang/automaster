<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Ivyward ad 2</title>
<style>
  @font-face { font-family: "Frank"; src: url(fonts/frank-ruhl-libre-latin-400-normal.woff2) format("woff2"); font-weight: 400; }
  @font-face { font-family: "Frank"; src: url(fonts/frank-ruhl-libre-latin-500-normal.woff2) format("woff2"); font-weight: 500; }
  @font-face { font-family: "Flex"; src: url(fonts/roboto-flex-latin-wght-normal.woff2) format("woff2"); font-weight: 100 1000; }
  /* Ivyward's social-video look: paper, the campus ink drawing, oxblood, Frank Ruhl Libre over Roboto Flex */
  :root { --bg: #fafafa; --ink: #09090b; --body: #27272a; --muted: #52525b; --line: #e4e4e7; --ox: #9b2c4e; --rose: #f6e7ec; --go: #047857; --gobg: #e6f4ee; --stop: #b91c1c; --stopbg: #fdecec; --dark: #18181b; --u: 1vw; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100vw; height: 100vh; overflow: hidden; background: var(--bg); color: var(--ink); font-family: "Flex", system-ui, sans-serif; }
  .serif { font-family: "Frank", Georgia, serif; font-weight: 400; letter-spacing: -0.02em; }
  .scene { position: absolute; inset: 0; display: none; }
  .bold { font-family: "Frank", Georgia, serif; font-weight: 400; letter-spacing: -0.02em; }
  .w { display: inline-block; opacity: 0; }
  .ink { position: absolute; left: -22vw; width: 144vw; bottom: -1vh; opacity: .9; transform-origin: 50% 100%; }
  #pbar { position: absolute; left: 0; right: 0; top: 0; height: calc(var(--u)*.75); background: var(--line); z-index: 20; }
  #pbar div { height: 100%; background: var(--ox); }
  .brandrow { position: absolute; left: 7.4vw; top: 3.4vh; display: flex; align-items: center; gap: calc(var(--u)*1.3); z-index: 3; }
  .brandrow img { width: calc(var(--u)*4.3); height: calc(var(--u)*4.3); }
  .brandrow span { font-family: "Frank", Georgia, serif; font-size: calc(var(--u)*3.9); }
  #ask .q { position: absolute; left: 7.4vw; right: 7.4vw; top: 16vh; font-size: calc(var(--u)*10.6); line-height: 1.04; }
  .ox { color: var(--ox); }
  .note { position: absolute; padding: calc(var(--u)*1.8) calc(var(--u)*3); background: #fff; border: 2px solid var(--line); color: var(--body); font-size: calc(var(--u)*3.6); border-radius: 999px; box-shadow: 0 calc(var(--u)*2) calc(var(--u)*4) calc(var(--u)*-2) rgba(9,9,11,.25); white-space: nowrap; }
  .note.pink, .note.blue { }
  #split { position: absolute; inset: 0; display: none; }
  .half { position: absolute; left: 0; right: 0; height: 50vh; overflow: hidden; }
  #top { top: 0; background: #efeff1; }
  #bot { top: 50vh; background: #fafafa; }
  .tag { position: absolute; left: 6vw; top: 3.4vh; display: inline-flex; align-items: center; gap: calc(var(--u)*1.4); padding: calc(var(--u)*1.3) calc(var(--u)*2.8); border-radius: 999px; font-weight: 650; font-size: calc(var(--u)*3.4); }
  #top .tag { background: #fff; color: var(--muted); border: 2px solid var(--line); }
  #bot .tag { background: var(--ox); color: #fff; top: 4.4vh; }
  #bot .tag img { width: calc(var(--u)*4.4); height: calc(var(--u)*4.4); }
  .win { position: absolute; left: 6vw; right: 6vw; top: 10.5vh; height: 35vh; background: #fff; border: 2px solid var(--line); border-radius: calc(var(--u)*4); box-shadow: 0 calc(var(--u)*3) calc(var(--u)*6) calc(var(--u)*-3) rgba(9,9,11,.25); overflow: hidden; }
  .tabs { display: flex; gap: calc(var(--u)*.6); padding: calc(var(--u)*1.6) calc(var(--u)*1.6) 0; background: #f4f4f5; height: calc(var(--u)*7); overflow: hidden; }
  .tabx { flex: 0 0 auto; width: calc(var(--u)*9); height: calc(var(--u)*5.4); background: #e4e4e7; border-radius: calc(var(--u)*1.2) calc(var(--u)*1.2) 0 0; }
  .tabx.on { background: #fff; }
  .winbody { padding: calc(var(--u)*3.6); }
  .big { font-family: "Frank", Georgia, serif; font-size: calc(var(--u)*5.6); letter-spacing: -0.02em; }
  .meta { font-size: calc(var(--u)*3.3); color: var(--muted); margin-top: calc(var(--u)*1); }
  .bar { height: calc(var(--u)*2); background: #efeff1; border-radius: 99px; margin-top: calc(var(--u)*2.2); }
  .modal { position: absolute; left: 50%; top: 56%; transform: translate(-50%, -50%); width: 80%; background: #fff; border: 2px solid rgba(185,28,28,.35); border-radius: calc(var(--u)*3); padding: calc(var(--u)*3.4); box-shadow: 0 calc(var(--u)*3) calc(var(--u)*7) calc(var(--u)*-2) rgba(185,28,28,.3); text-align: center; }
  .modal .t { color: var(--stop); font-family: "Frank", Georgia, serif; font-size: calc(var(--u)*5.4); }
  .modal .s { color: var(--muted); font-size: calc(var(--u)*3.2); margin-top: calc(var(--u)*1); }
  .clock { position: absolute; right: 6vw; top: 3.6vh; font-weight: 650; font-size: calc(var(--u)*4); color: var(--stop); font-variant-numeric: tabular-nums; }
  .list { position: absolute; left: 6vw; right: 6vw; top: 12vh; }
  .item { display: flex; align-items: center; justify-content: space-between; gap: calc(var(--u)*2); background: #fff; border: 2px solid var(--line); border-radius: calc(var(--u)*3.4); padding: calc(var(--u)*3.2) calc(var(--u)*3.6); margin-bottom: calc(var(--u)*2); box-shadow: 0 calc(var(--u)*2) calc(var(--u)*4) calc(var(--u)*-2) rgba(9,9,11,.18); }
  .item .nm { font-weight: 600; font-size: calc(var(--u)*4.4); }
  .item .ct { color: var(--muted); font-size: calc(var(--u)*3.3); margin-top: calc(var(--u)*.5); }
  .pill { font-size: calc(var(--u)*2.8); font-weight: 650; padding: calc(var(--u)*1) calc(var(--u)*2); border-radius: 999px; white-space: nowrap; }
  .pill.go { color: var(--go); background: var(--gobg); }
  .pill.ox { color: var(--ox); background: var(--rose); }
  .tick { width: calc(var(--u)*6); height: calc(var(--u)*6); border-radius: 50%; background: var(--rose); display: inline-flex; align-items: center; justify-content: center; flex: none; }
  .tick::after { content: ""; width: 60%; height: 60%; background: url(check.svg) center/contain no-repeat; }
  .spin { width: calc(var(--u)*5.4); height: calc(var(--u)*5.4); border-radius: 50%; border: calc(var(--u)*.8) solid #e4e4e7; border-top-color: var(--ox); flex: none; }
  #cap { position: absolute; left: 50%; top: 50vh; transform: translate(-50%, -50%); z-index: 5; background: var(--dark); color: #fff; font-weight: 600; font-size: calc(var(--u)*4.4); padding: calc(var(--u)*2) calc(var(--u)*3.8); border-radius: calc(var(--u)*2.4); white-space: nowrap; text-align: center; max-width: 92vw; }
  #cap .y { color: #f3b6c9; }
  #cta { background: var(--bg); color: var(--ink); }
  #cta .c { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding: 27vh 8vw 0; text-align: center; }
  .btn { margin-top: calc(var(--u)*6); padding: calc(var(--u)*3.2) calc(var(--u)*7.5); background: var(--ox); color: #fff; border-radius: 999px; font-weight: 650; font-size: calc(var(--u)*5.6); }
  .tile { width: calc(var(--u)*19); height: calc(var(--u)*19); border-radius: calc(var(--u)*4.5); background: var(--ox); display: flex; align-items: center; justify-content: center; }
  .tile img { width: 72%; height: 72%; }
  .urlpill { position: absolute; left: 50%; transform: translateX(-50%); bottom: 6.5vh; background: var(--dark); color: #fff; font-weight: 600; font-size: calc(var(--u)*3.4); padding: calc(var(--u)*1.7) calc(var(--u)*3.4); border-radius: calc(var(--u)*1.9); }
</style>
</head>
<body>
<div id="pbar"><div></div></div>

<section class="scene" id="ask">
  <img class="ink" src="ink.png" alt="">
  <div class="brandrow"><img src="mark.svg" alt=""><span>Ivyward</span></div>
  <div id="notes"></div>
  <div class="q bold" id="askt"></div>
</section>

<section id="split">
  <div class="half" id="top">
    <div class="tag" id="ttag">Doing it alone</div>
    <div class="clock" id="clock">11:52 PM</div>
    <div class="win" id="twin">
      <div class="tabs" id="tabs"></div>
      <div class="winbody">
        <div class="big" id="tbig">Application form</div>
        <div class="meta" id="tmeta">Page 3 of 12</div>
        <div class="bar" style="width:92%"></div><div class="bar" style="width:76%"></div><div class="bar" style="width:84%"></div>
      </div>
      <div class="modal" id="tmodal"><div class="t" id="tmt">Session expired</div><div class="s" id="tms">Unsaved changes lost</div></div>
    </div>
  </div>
  <div class="half" id="bot">
    <div class="tag" id="btag"><img src="mark-light.svg" alt="">With Ivyward AI</div>
    <div class="list" id="blist"></div>
  </div>
  <div id="cap"></div>
</section>

<section class="scene" id="cta">
  <img class="ink" src="ink.png" alt="">
  <div class="brandrow"><img src="mark.svg" alt=""><span>Ivyward</span></div>
  <div class="c">
    <div class="tile" id="cm"><img src="mark-light.svg" alt=""></div>
    <div class="serif" id="cn" style="font-size:calc(var(--u)*9.6);line-height:1.04;margin-top:calc(var(--u)*5)">Your university applications, done for you.</div>
    <div class="btn" id="cb">Start for free</div>
    <div id="cs"></div>
  </div>
  <div class="urlpill" id="cu">tryivyward.com</div>
</section>

<script>
const B = Object.fromEntries((window.BEATS || []).map((b) => [b.id, b]));
const $ = (s) => document.querySelector(s);
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const ease = (x) => 1 - Math.pow(1 - clamp(x), 3);
const back = (x) => { x = clamp(x); const c = 1.2; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const VW = innerWidth / 100;

function words(el, html) {
  el.innerHTML = html;
  const walk = document.createTreeWalker(el, NodeFilter.SHOW_TEXT), nodes = [];
  while (walk.nextNode()) nodes.push(walk.currentNode);
  for (const n of nodes) {
    const f = document.createDocumentFragment();
    for (const p of n.textContent.split(/(\s+)/)) {
      if (!p) continue;
      if (/^\s+$/.test(p)) { f.appendChild(document.createTextNode(" ")); continue; }
      const w = document.createElement("span"); w.className = "w"; w.textContent = p; f.appendChild(w);
    }
    n.replaceWith(f);
  }
  return [...el.querySelectorAll(".w")];
}
const askw = words($("#askt"), `Planning your <span class="ox">master's abroad</span>, but don't know where to start?`);
const NOTES = [["Which school?", "", 7.4, 47, -3], ["Where's the funding?", "", 46, 52, 3], ["Statement of purpose?", "", 7.4, 57.5, 2], ["IELTS or TOEFL?", "", 52, 63, -2], ["12 application forms", "", 7.4, 68, -2], ["Deadline: 15 January", "", 44, 73.5, 2]];
const notes = NOTES.map(([t, c, x, y, a]) => { const d = document.createElement("div"); d.className = "note " + c; d.textContent = t; d.style.left = x + "vw"; d.style.top = y + "vh"; d.dataset.a = a; $("#notes").appendChild(d); return d; });
for (let i = 0; i < 9; i++) { const t = document.createElement("div"); t.className = "tabx" + (i === 8 ? " on" : ""); $("#tabs").appendChild(t); }

const ITEMS = {
  find: [["MSc Data Science", "United Kingdom", `<span class="pill go">Scholarship match</span>`], ["MA Public Policy", "Canada", `<span class="pill ox">Fully funded option</span>`], ["MSc Public Health", "Netherlands", `<span class="pill go">Scholarship match</span>`]],
};
function listHTML(stage) {
  if (stage === "with") return ["Programmes and scholarships", "Essays", "Application forms"].map((t) => `<div class="item"><div class="nm">${t}</div><span class="spin"></span></div>`).join("");
  if (stage === "find") return ITEMS.find.map(([n, c, p]) => `<div class="item"><div><div class="nm">${n}</div><div class="ct">${c}</div></div>${p}</div>`).join("");
  if (stage === "essay") return [["Statement of purpose", "MSc Data Science"], ["Scholarship essay", "MA Public Policy"], ["Personal statement", "MSc Public Health"]].map(([n, c]) => `<div class="item"><div><div class="nm">${n}</div><div class="ct">${c} · written and checked</div></div><span class="tick">✓</span></div>`).join("");
  if (stage === "form") return [["United Kingdom", "12 of 12 pages"], ["Canada", "9 of 9 pages"], ["Netherlands", "7 of 7 pages"]].map(([n, c]) => `<div class="item"><div><div class="nm">${n}</div><div class="ct">Application form · ${c} filled</div></div><span class="tick">✓</span></div>`).join("") + `<div class="item" style="background:var(--ink);color:#fff;justify-content:center"><div class="nm">Ready for your signature</div></div>`;
  return "";
}
let lastStage = "";
function setList(stage) { if (stage !== lastStage) { $("#blist").innerHTML = listHTML(stage); lastStage = stage; } return [...$("#blist").children]; }

const CAPS = {
  alone: `Here's how it usually goes…`,
  with: `…and with <span class="y">Ivyward AI</span>`,
  find: `Finds <span class="y">funded programmes</span> that fit you`,
  essay: `Writes <span class="y">your essays</span>`,
  form: `Fills <span class="y">every application</span>`,
};

function renderAt(t) {
  $("#pbar div").style.width = Math.min(100, (t / window.TOTAL) * 100) + "%";
  document.querySelectorAll(".ink").forEach((el) => (el.style.transform = `translateX(${Math.sin(t * 0.25) * 1.3 * VW}px) scale(${1 + 0.05 * t / window.TOTAL})`));
  const b = (window.BEATS || []).find((x) => t >= x.start && t < x.start + x.dur) || window.BEATS[window.BEATS.length - 1];
  const s = t - b.start, d = b.dur;
  $("#ask").style.display = b.id === "ask" ? "block" : "none";
  $("#split").style.display = ["alone", "with", "find", "essay", "form"].includes(b.id) ? "block" : "none";
  $("#cta").style.display = b.id === "cta" ? "block" : "none";

  if (b.id === "ask") {
    const span = b.voice * 0.9;
    askw.forEach((w, i) => { const k = ease((s - 0.15 - (i / askw.length) * span) / 0.3); w.style.opacity = k; w.style.transform = `translateY(${(1 - k) * 0.32}em)`; });
    notes.forEach((n, i) => { const k = back((s - 0.6 - i * (b.voice * 0.55 / NOTES.length)) / 0.4); n.style.opacity = clamp(k); n.style.transform = `rotate(${n.dataset.a * clamp(k)}deg) translateY(${(1 - clamp(k)) * 3 * VW}px) scale(${0.85 + 0.15 * k})`; });
    // the whole screen slides up as the split arrives
    $("#ask").style.transform = `translateY(${-ease((s - (d - 0.25)) / 0.25) * 100}vh)`;
  }
  if ($("#split").style.display === "block") {
    const sinceAlone = t - B.alone.start;
    // top slides down from above; bottom fades up when "with" starts
    $("#top").style.transform = `translateY(${(1 - ease(sinceAlone / 0.35)) * -50}vh)`;
    const sinceWith = t - B.with.start;
    const bk = ease(sinceWith / 0.4);
    $("#bot").style.opacity = b.id === "alone" ? 0.25 : 0.25 + 0.75 * bk;
    $("#bot").style.filter = b.id === "alone" ? "grayscale(1)" : `grayscale(${1 - bk})`;
    $("#btag").style.transform = `scale(${b.id === "alone" ? 0.95 : 0.95 + 0.05 * back(sinceWith / 0.4)})`;
    // top: the clock runs, tabs pile up, the session expires, then an upload fails
    const mins = Math.min(59, 52 + Math.floor(sinceAlone / 2.2));
    $("#clock").textContent = `11:${String(mins).padStart(2, "0")} PM`;
    const nt = Math.min(9, 3 + Math.floor(sinceAlone * 1.6));
    [...$("#tabs").children].forEach((x, i) => (x.style.display = i < nt ? "block" : "none"));
    let modal = 0, mt = "Session expired", ms = "Unsaved changes lost", big = "Application form", meta = "Page 3 of 12";
    if (b.id === "alone") modal = back((s - 1.1) / 0.3);
    if (b.id === "with") { modal = 1 - ease((s - 0.2) / 0.3); }
    if (b.id === "find") { big = "Scholarship search"; meta = "Searching… 0 results that fit"; }
    if (b.id === "essay") { big = "SOP_v5_FINAL_final.docx"; meta = "Rewriting it again"; }
    if (b.id === "form") { mt = "Upload failed"; ms = "transcript.pdf: try again"; big = "Application form"; meta = "Page 9 of 12"; modal = back((s - 0.5) / 0.3); }
    $("#tbig").textContent = big; $("#tmeta").textContent = meta; $("#tmt").textContent = mt; $("#tms").textContent = ms;
    $("#tmodal").style.opacity = clamp(modal); $("#tmodal").style.transform = `translate(-50%, -50%) scale(${0.7 + 0.3 * modal})`;
    const shake = (b.id === "alone" && s > 1.1 && s < 1.5) || (b.id === "form" && s > 0.5 && s < 0.9) ? Math.sin(t * 70) * VW * 0.8 : 0;
    $("#twin").style.transform = `translateX(${shake}px)`;
    // bottom: the agent's work, item by item
    const stage = b.id === "alone" ? "with" : b.id;
    const items = setList(stage);
    items.forEach((it, i) => { const k = back((s - (b.id === "alone" ? 99 : 0.25 + i * 0.28)) / 0.3); it.style.opacity = b.id === "alone" ? 0.6 : clamp(k); it.style.transform = `translateY(${(1 - clamp(k)) * VW * 5}px) scale(${b.id === "alone" ? 1 : 0.92 + 0.08 * k})`; });
    // caption on the seam
    $("#cap").innerHTML = CAPS[b.id] || "";
    const ck = back(s / 0.3);
    $("#cap").style.opacity = Math.min(clamp(ck), ease((d - s) / 0.12));
    $("#cap").style.transform = `translate(-50%, -50%) scale(${0.85 + 0.15 * ck})`;
    // the halves pull apart to make way for the end card
    if (b.id === "form") { const out = ease((s - (d - 0.3)) / 0.3); $("#top").style.transform = `translateY(${-out * 50}vh)`; $("#bot").style.transform = `translateY(${out * 50}vh)`; }
    else $("#bot").style.transform = "none";
  }
  if (b.id === "cta") {
    const k = (x, w = 0.4) => back((s - x) / w);
    $("#cm").style.transform = `scale(${k(0)})`;
    [["#cn", 0.3], ["#cb", 0.75]].forEach(([q, at]) => { const v = k(at); $(q).style.opacity = clamp(v); $(q).style.transform = `translateY(${(1 - clamp(v)) * VW * 4}px) scale(${q === "#cb" ? 0.9 + 0.1 * v + (s > 1.5 ? 0.025 * Math.sin((s - 1.5) * 5) : 0) : 1})`; });
  }
}

function cues() {
  const sfx = [];
  NOTES.forEach((n, i) => sfx.push({ t: B.ask.start + 0.6 + i * (B.ask.voice * 0.55 / NOTES.length), kind: "tick", gain: 0.5 }));
  sfx.push({ t: B.alone.start - 0.1, kind: "whoosh", gain: 0.6 });
  sfx.push({ t: B.alone.start + 1.1, kind: "error", gain: 0.6 });
  sfx.push({ t: B.with.start, kind: "rise", gain: 0.8 });
  for (const id of ["find", "essay", "form"]) [0, 1, 2].forEach((i) => sfx.push({ t: B[id].start + 0.25 + i * 0.28, kind: "tick", gain: 0.5 }));
  sfx.push({ t: B.form.start + 0.5, kind: "error", gain: 0.45 });
  sfx.push({ t: B.form.start + 0.25 + 3 * 0.28, kind: "chime", gain: 0.8 });
  sfx.push({ t: B.cta.start - 0.1, kind: "whoosh", gain: 0.6 });
  return { sfx, music: { bpm: 100, key: "F", drumsFrom: B.with.start, endCard: B.cta.start } };
}
window.renderAt = renderAt; window.cues = cues;
</script>
</body>
</html>
