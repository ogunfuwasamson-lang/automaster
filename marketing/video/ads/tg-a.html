<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Ivyward Telegram ad A: 40 saved, 0 sent</title>
<style>
  @font-face { font-family: "Frank"; src: url(fonts/frank-ruhl-libre-latin-400-normal.woff2) format("woff2"); font-weight: 400; }
  @font-face { font-family: "Flex"; src: url(fonts/roboto-flex-latin-wght-normal.woff2) format("woff2"); font-weight: 100 1000; }
  /* Telegram channel ad (telega.io), 1080x1080. One idea, readable in a second at phone size. Lands on /match. */
  :root { --ox: #9b2c4e; --paper: #fafafa; --ink: #09090b; --pink: #f4c7d5; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1080px; overflow: hidden; background: var(--ox); color: #fff; font-family: "Flex", system-ui, sans-serif; }
  .brand { position: absolute; left: 76px; top: 64px; display: flex; align-items: center; gap: 14px; font-family: "Frank", Georgia, serif; font-size: 42px; }
  .brand img { width: 48px; height: 48px; }
  .stat { position: absolute; left: 64px; display: flex; align-items: baseline; gap: 34px; }
  .n { font-family: "Frank", Georgia, serif; font-size: 360px; line-height: .8; letter-spacing: -0.04em; font-variant-numeric: lining-nums; }
  .l { font-size: 56px; font-weight: 640; line-height: 1.08; letter-spacing: -0.01em; }
  .s1 { top: 170px; }
  .s2 { top: 512px; }
  .s2 .n, .s2 .l { color: var(--pink); }
  .band { position: absolute; left: 0; right: 0; bottom: 0; height: 214px; background: var(--paper); color: var(--ink); padding: 44px 76px 0; }
  .band b { display: block; font-size: 54px; font-weight: 700; letter-spacing: -0.015em; line-height: 1.05; }
  .band span { display: block; margin-top: 16px; font-size: 42px; font-weight: 600; color: var(--ox); }
</style>
</head>
<body>
  <div class="brand"><img src="mark-light.svg" alt="">Ivyward</div>
  <div class="stat s1"><div class="n">40</div><div class="l">scholarship posts<br>saved</div></div>
  <div class="stat s2"><div class="n">0</div><div class="l">applications<br>sent</div></div>
  <div class="band"><b>See which ones fit you in 30 seconds.</b><span>Free at tryivyward.com/match</span></div>
</body>
</html>
