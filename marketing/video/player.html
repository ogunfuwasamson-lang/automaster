<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
/* the frame every Ivyward social video is drawn in: 1080 x 1350 (4:5, Facebook and Instagram feed).
   render.mjs sets window.SPEC, then calls renderAt(t) once per frame; nothing here runs on its own clock. */
@font-face { font-family: "Frank Ruhl Libre"; font-weight: 400; src: url("fonts/frank-ruhl-libre-latin-400-normal.woff2"); }
@font-face { font-family: "Frank Ruhl Libre"; font-weight: 500; src: url("fonts/frank-ruhl-libre-latin-500-normal.woff2"); }
@font-face { font-family: "Roboto Flex"; font-weight: 100 1000; src: url("fonts/roboto-flex-latin-wght-normal.woff2"); }
:root {
  --paper: #fafafa; --ink: #09090b; --muted: #52525b; --line: #e4e4e7;
  --brand: #9b2c4e; --brand-soft: #f6e7ec; --card: #ffffff; --wash: #3f3f46; --dark: #18181b;
  --serif: "Frank Ruhl Libre", Georgia, serif; --sans: "Roboto Flex", system-ui, sans-serif;
}
* { margin: 0; box-sizing: border-box; }
html, body { width: 1080px; height: 1350px; overflow: hidden; background: var(--paper); color: var(--ink); font-family: var(--sans); }
#stage { position: relative; width: 1080px; height: 1350px; overflow: hidden; }
#ink { position: absolute; left: -230px; bottom: -10px; width: 1540px; height: 693px; color: var(--wash); transform-origin: 50% 100%; }
#ink svg { width: 100%; height: 100%; }
#bar { position: absolute; left: 0; top: 0; height: 8px; width: 1080px; background: var(--line); }
#bar i { display: block; height: 100%; width: 0; background: var(--brand); }
header { position: absolute; left: 80px; top: 64px; display: flex; align-items: center; gap: 14px; font-family: var(--serif); font-size: 40px; letter-spacing: -0.02em; }
header svg { width: 44px; height: 44px; color: var(--brand); }
footer { position: absolute; left: 0; right: 0; bottom: 70px; text-align: center; }
footer span { display: inline-block; font-weight: 600; font-size: 32px; color: #fff; background: var(--dark); padding: 16px 34px; border-radius: 18px; }
.scene { position: absolute; left: 80px; right: 80px; top: 200px; bottom: 260px; display: flex; flex-direction: column; justify-content: center; gap: 34px; opacity: 0; }
.a { will-change: transform, opacity; }
h1 { font-family: var(--serif); font-weight: 400; font-size: 96px; line-height: 1.04; letter-spacing: -0.025em; text-wrap: balance; }
h1 .w { display: inline-block; }
h2 { font-family: var(--serif); font-weight: 400; font-size: 72px; line-height: 1.08; letter-spacing: -0.02em; text-wrap: balance; }
.sub { font-size: 42px; line-height: 1.38; color: var(--muted); text-wrap: pretty; }
.body { font-size: 40px; line-height: 1.42; color: #27272a; text-wrap: pretty; }
.step { font-size: 30px; font-weight: 600; color: var(--brand); }
.note { font-size: 30px; line-height: 1.4; color: var(--muted); border-left: 4px solid var(--brand); padding-left: 22px; }
ul { list-style: none; display: flex; flex-direction: column; gap: 26px; }
li { display: grid; grid-template-columns: 56px 1fr; gap: 22px; align-items: start; font-size: 40px; line-height: 1.32; }
li b { width: 56px; height: 56px; border-radius: 50%; background: var(--brand-soft); display: grid; place-items: center; }
li b svg { width: 30px; height: 30px; color: var(--brand); }
.stat { font-family: var(--serif); font-size: 230px; line-height: 0.95; color: var(--brand); letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 40px; padding: 64px 60px; box-shadow: 0 2px 4px rgb(9 9 11 / 0.04), 0 30px 60px -30px rgb(9 9 11 / 0.25); display: flex; flex-direction: column; gap: 30px; }
.cta { align-items: center; text-align: center; }
.cta .mark { width: 150px; height: 150px; border-radius: 34px; background: var(--brand); display: grid; place-items: center; }
.cta .mark svg { width: 110px; height: 110px; color: #fbf4ef; }
.cta h1 { font-size: 88px; }
</style>
</head>
<body>
<div id="stage">
  <div id="ink"></div>
  <div id="bar"><i></i></div>
  <header><svg viewBox="0 0 32 32" fill="none"><path d="M5 28V11l3-4 3 4v17M21 28V11l3-4 3 4v17" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/><path d="M11 28V19a5 5 0 0 1 10 0v9" stroke="currentColor" stroke-width="2.2"/><path d="M3 28h26" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/><path d="M11 14h10" stroke="currentColor" stroke-width="2.2"/></svg>Ivyward</header>
  <main id="scenes"></main>
  <footer><span>tryivyward.com</span></footer>
</div>
<script>
const MARK = '<svg viewBox="0 0 32 32" fill="none"><path d="M5 28V11l3-4 3 4v17M21 28V11l3-4 3 4v17" stroke="currentColor" stroke-width="2.6" stroke-linejoin="round"/><path d="M11 28V19a5 5 0 0 1 10 0v9" stroke="currentColor" stroke-width="2.6"/><path d="M3 28h26" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/><path d="M11 14h10" stroke="currentColor" stroke-width="2.6"/></svg>';
const CHECK = '<svg viewBox="0 0 24 24" fill="none"><path d="M5 12.5l4.5 4.5L19 7.5" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const words = (s) => String(s ?? "").split(/\s+/).filter(Boolean).length;
const clamp = (x) => Math.max(0, Math.min(1, x));
const ease = (x) => 1 - Math.pow(1 - clamp(x), 3);

// how long a scene stays up: long enough to read it twice at a relaxed pace
function autoDur(s) {
  const text = [s.title, s.sub, s.body, s.note, s.caption, ...(s.items ?? [])].join(" ");
  return Math.max(s.kind === "cta" ? 4 : 3.2, 1.8 + words(text) / 2.9);
}

function build(spec) {
  document.getElementById("ink").innerHTML = window.INK || "";
  const root = document.getElementById("scenes");
  let t = 0;
  const scenes = spec.scenes.map((s, i) => {
    const el = document.createElement("section");
    el.className = "scene" + (s.kind === "cta" ? " cta" : "");
    let d = 0.15;
    const a = (html, step = 0.35) => { const out = `<div class="a" data-d="${d.toFixed(2)}">${html}</div>`; d += step; return out; };
    let html = "";
    if (s.kind === "hook") {
      const ws = String(s.title).split(/\s+/);
      html = `<h1>${ws.map((w, k) => `<span class="w a" data-d="${(0.1 + k * 0.11).toFixed(2)}">${esc(w)}</span>`).join(" ")}</h1>`;
      d = 0.25 + ws.length * 0.11;
      if (s.sub) html += a(`<p class="sub">${esc(s.sub)}</p>`);
    } else if (s.kind === "point") {
      if (s.step) html += a(`<p class="step">${esc(s.step)}</p>`, 0.2);
      html += a(`<h2>${esc(s.title)}</h2>`);
      if (s.body) html += a(`<p class="body">${esc(s.body)}</p>`);
      if (s.note) html += a(`<p class="note">${esc(s.note)}</p>`);
    } else if (s.kind === "list") {
      html += a(`<h2>${esc(s.title)}</h2>`, 0.5);
      html += `<ul>${(s.items ?? []).map((it) => a(`<li><b>${CHECK}</b><span>${esc(it)}</span></li>`, 0.45)).join("")}</ul>`;
    } else if (s.kind === "stat") {
      html += a(`<p class="stat" data-count="${Number(s.value) || 0}" data-prefix="${esc(s.prefix)}" data-suffix="${esc(s.suffix)}">${esc(s.prefix)}0${esc(s.suffix)}</p>`, 0.3);
      html += a(`<h2>${esc(s.title)}</h2>`);
      if (s.body) html += a(`<p class="body">${esc(s.body)}</p>`);
    } else if (s.kind === "card") {
      let inner = "";
      if (s.step) inner += `<p class="step">${esc(s.step)}</p>`;
      inner += `<h2>${esc(s.title)}</h2>`;
      if (s.body) inner += `<p class="body">${esc(s.body)}</p>`;
      html = `<div class="card">${inner}</div>`;
    } else if (s.kind === "cta") {
      html += a(`<div class="mark">${MARK}</div>`, 0.3);
      html += a(`<h1>${esc(s.title || "Your university applications, done for you.")}</h1>`);
      html += a(`<p class="sub">${esc(s.sub || "Start for free at tryivyward.com")}</p>`);
    }
    el.innerHTML = html;
    root.appendChild(el);
    const dur = Math.max(s.dur ?? autoDur(s), s.minDur ?? 0);
    const scene = { el, kind: s.kind, start: t, dur, parts: [...el.querySelectorAll(".a")].map((p) => ({ p, d: Number(p.dataset.d) })), stat: el.querySelector("[data-count]"), card: el.querySelector(".card") };
    t += dur;
    return scene;
  });
  window.TOTAL = t;
  window.SCENES = scenes;
}

// draw the frame at time t (seconds). pure: the same t always draws the same frame
window.renderAt = function (t) {
  const total = window.TOTAL;
  document.querySelector("#bar i").style.width = `${(clamp(t / total) * 100).toFixed(2)}%`;
  const ink = document.getElementById("ink");
  ink.style.transform = `translateX(${(Math.sin(t * 0.25) * 14).toFixed(1)}px) scale(${(1 + 0.05 * (t / total)).toFixed(4)})`;
  for (const s of window.SCENES) {
    const local = t - s.start;
    const last = s === window.SCENES[window.SCENES.length - 1];
    const fadeOut = last ? 0 : 0.45;
    if (local < 0 || local > s.dur) { s.el.style.opacity = 0; continue; }
    const out = fadeOut ? clamp((s.dur - local) / fadeOut) : 1;
    s.el.style.opacity = out.toFixed(3);
    if (s.card) {
      const k = ease(local / 0.6);
      const leave = fadeOut ? 1 - out : 0;
      s.card.style.transform = `translateX(${((1 - k) * 220 - leave * 220).toFixed(1)}px) rotate(${((1 - k) * 2.5).toFixed(2)}deg)`;
      s.card.style.opacity = k.toFixed(3);
    }
    for (const { p, d } of s.parts) {
      const k = ease((local - d) / 0.55);
      p.style.opacity = k.toFixed(3);
      p.style.transform = `translateY(${((1 - k) * 34).toFixed(1)}px)`;
    }
    if (s.stat) {
      const v = Number(s.stat.dataset.count);
      const k = ease((local - 0.2) / 1.4);
      const n = v * k;
      const shown = v >= 100 ? Math.round(n).toLocaleString("en-US") : (Number.isInteger(v) ? Math.round(n) : n.toFixed(1));
      s.stat.textContent = `${s.stat.dataset.prefix}${shown}${s.stat.dataset.suffix}`;
    }
  }
};

build(window.SPEC);
window.renderAt(0);
</script>
</body>
</html>
